name: on-schedule
run-name: on schedule

on:
  schedule:
    # weekly
    - cron: "0 0 * * 1"

  # run if user manually requests it
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-citations:
    # only run on user instance of template, not template itself
    if: github.repository != 'greenelab/lab-website-template'
    uses: ./.github/workflows/update-citations.yaml
    secrets: inherit
    with:
      # commit citation updates straight to main
      # (repo does not allow GitHub Actions to open pull requests)
      open-pr: false

  # commits made by the workflow token don't trigger on-push,
  # so rebuild the site here to publish updated citations
  build-site:
    needs: update-citations
    uses: ./.github/workflows/build-site.yaml
